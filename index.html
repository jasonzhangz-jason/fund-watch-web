<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="基金盯盘">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<title>基金盯盘 · 天天基金数据 Web UI</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --panel2: #273449; --line: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --primary: #38bdf8; --up: #ef4444; --down: #22c55e;
    --gold: #fbbf24; --radius: 12px;
    /* 安全区（iOS 刘海/小白条）：非 iOS 环境自动为 0 */
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", "Noto Sans SC", sans-serif;
    min-height: 100vh; min-height: 100dvh;          /* iOS 地址栏收起时 100vh 会溢出，用 dvh 兜底 */
    padding-bottom: var(--sab);
    overflow-x: hidden;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: rgba(15,23,42,.92);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding-top: var(--sat);                        /* 刘海屏：内容下移，避免被状态栏遮挡 */
  }
  .wrap {
    max-width: 1080px; margin: 0 auto;
    padding: 14px max(16px, var(--sar)) 14px max(16px, var(--sal));
  }
  .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .logo { font-size: 20px; font-weight: 700; }
  .logo em { color: var(--primary); font-style: normal; }
  nav.tabs { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  .tab { padding: 7px 16px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; font-size: 14px; transition: .2s; min-height: 36px; }
  .tab.active { background: var(--primary); color: #0b1220; border-color: var(--primary); font-weight: 700; }
  main.wrap { padding-top: 20px; padding-bottom: calc(60px + var(--sab)); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; }
  .panel h2 { font-size: 16px; margin-bottom: 14px; color: var(--gold); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input[type=text], input[type=password] { flex: 1; min-width: 200px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); font-size: 14px; outline: none; }
  input[type=text]:focus, input[type=password]:focus { border-color: var(--primary); }
  .btn { padding: 10px 18px; border-radius: 10px; border: none; background: var(--primary); color: #0b1220; font-weight: 700; cursor: pointer; font-size: 14px; min-height: 40px; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  .btn.danger { background: rgba(239,68,68,.15); color: var(--up); border: 1px solid rgba(239,68,68,.4); }
  .btn.sm { padding: 6px 12px; min-height: 34px; font-size: 13px; }
  .user-box { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .user-box .uname { color: var(--text); font-weight: 600; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 账号弹窗 */
  .modal-mask { position: fixed; inset: 0; background: rgba(2,6,23,.72); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .modal-mask.show { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; width: 100%; max-width: 380px; }
  .modal h3 { font-size: 17px; color: var(--gold); margin-bottom: 14px; }
  .modal .err { color: var(--up); font-size: 13px; min-height: 18px; margin-bottom: 8px; }
  .modal input[type=text], .modal input[type=password] { width: 100%; min-width: 0; margin-bottom: 10px; }
  .modal .actions { display: flex; gap: 10px; margin-top: 4px; }
  .modal .actions .btn { flex: 1; }
  .modal .switch { margin-top: 14px; font-size: 13px; color: var(--muted); text-align: center; }
  .modal .switch a { color: var(--primary); cursor: pointer; text-decoration: underline; }
  /* 后台管理 */
  .admin-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; text-align: center; }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat .v { font-size: 22px; font-weight: 700; color: var(--primary); margin-top: 4px; }
  .admin-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 560px; }
  .admin-table th, .admin-table td { padding: 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  .admin-table tbody tr:hover td { background: rgba(56,189,248,.06); }
  .role-badge { padding: 2px 8px; border-radius: 6px; font-size: 11px; border: 1px solid var(--line); color: var(--muted); }
  .role-badge.admin { background: rgba(251,191,36,.15); color: var(--gold); border-color: rgba(251,191,36,.4); }
  .fund-chip { display: inline-block; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; margin: 0 8px 8px 0; font-size: 13px; }
  .fund-chip b { color: var(--primary); font-weight: 700; margin-right: 6px; }
  .admin-entry { background: rgba(251,191,36,.15); color: var(--gold); border: 1px solid rgba(251,191,36,.4); }
  .fund-card { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--radius); background: var(--panel2); border: 1px solid var(--line); margin-bottom: 10px; flex-wrap: wrap; }
  .fc-name { flex: 1; min-width: 160px; }
  .fc-name .n { font-weight: 700; font-size: 15px; }
  .fc-name .c { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .fc-quote { text-align: right; min-width: 120px; }
  .q-num { font-size: 20px; font-weight: 700; }
  .q-pct { font-size: 14px; margin-top: 2px; }
  .q-time { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; background: var(--panel2); color: var(--muted); border: 1px solid var(--line); margin-left: 6px; }
  .search-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); margin-bottom: 8px; flex-wrap: wrap; }
  .si-info { flex: 1; min-width: 180px; }
  .si-info .n { font-weight: 600; }
  .si-info .c { color: var(--muted); font-size: 12px; }
  .hint { color: var(--muted); font-size: 13px; line-height: 1.7; }
  .grid-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .metric { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; text-align: center; }
  .metric .k { color: var(--muted); font-size: 12px; }
  .metric .v { font-size: 16px; font-weight: 700; margin-top: 4px; }
  canvas { width: 100%; height: 260px; background: var(--panel2); border-radius: 10px; border: 1px solid var(--line); }
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 420px; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--gold); color: #0b1220; padding: 10px 22px; border-radius: 999px; font-size: 14px; font-weight: 700; opacity: 0; pointer-events: none; transition: .3s; z-index: 99; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
  .auto-refresh { color: var(--muted); font-size: 12px; margin-left: auto; }
  /* ===================================================================
     自适应断点体系：桌面(≥1024) / 平板(641-1023) / 手机(≤640) / 超窄(≤360)
                     横屏手机 / 悬停设备 / 减弱动画
     =================================================================== */

  /* ---- 桌面 / 大屏：列表改多列，充分利用横向空间 ---- */
  @media (min-width: 1024px) {
    .wrap { max-width: 1180px; }
    #watch-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
    #watch-list .fund-card { margin-bottom: 0; }
    #quote-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    #quote-list .fund-card { margin-bottom: 0; }
    .admin-stats { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .grid-metrics { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    canvas { height: 300px; }
  }

  /* ---- 平板：中间断点，指标 4 列，去掉多余留白 ---- */
  @media (min-width: 641px) and (max-width: 1023px) {
    .wrap { padding-left: max(20px, var(--sal)); padding-right: max(20px, var(--sar)); }
    .grid-metrics { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .admin-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    input[type=text], input[type=password], .btn { min-height: 42px; }
  }

  /* ---- 手机（iOS / Android）：单列、触控优先、安全区适配 ---- */
  @media (max-width: 640px) {
    header { position: sticky; top: 0; }
    .top { gap: 8px; }
    .logo { font-size: 17px; }
    .user-box { margin-left: auto; }
    nav.tabs {
      width: 100%; order: 3; margin-left: 0;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      flex-wrap: nowrap; padding-bottom: 4px;
      scrollbar-width: none;                 /* Firefox 隐藏滚动条 */
    }
    nav.tabs::-webkit-scrollbar { display: none; }   /* iOS/Chrome 隐藏滚动条 */
    .tab { flex: 0 0 auto; min-height: 44px; font-size: 14px; padding: 8px 18px; }
    main.wrap { padding: 14px 12px calc(40px + var(--sab)); }
    .panel { padding: 14px; border-radius: 10px; }
    input[type=text], input[type=password] { font-size: 16px; min-height: 44px; min-width: 0; } /* ≥16px 防 iOS 聚焦放大 */
    .btn { min-height: 44px; padding: 10px 16px; }         /* 触控热区 ≥44px */
    .btn.sm { min-height: 44px; padding: 8px 14px; }        /* 头部小按钮同样满足 44px */
    .user-box .btn.sm { padding: 8px 12px; }
    .fund-card { gap: 10px; padding: 12px; }
    .fc-name { min-width: 100%; }
    .fc-quote { text-align: left; min-width: 0; flex: 1; }
    .fund-card .row { width: 100%; }
    .fund-card .row .btn { flex: 1; text-align: center; }
    .search-item { gap: 8px; padding: 10px 12px; }
    .si-info { min-width: 100%; }
    .search-item .row { width: 100%; }
    .search-item .row .btn { flex: 1; text-align: center; }
    .grid-metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .metric { padding: 10px 6px; }
    .metric .v { font-size: 14px; }
    .metric .k { font-size: 11px; }
    canvas { height: 200px; }
    .row > input[type=text], .row > input[type=password] { min-width: 100%; }
    .row > .btn { flex: 1; }
    .panel h2 { font-size: 15px; }
    .modal { padding: 20px; max-height: 88dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .modal-mask { padding: max(16px, var(--sat)) max(16px, var(--sar)) max(16px, var(--sab)) max(16px, var(--sal)); }
    .admin-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .stat { padding: 12px 8px; }
    .stat .v { font-size: 18px; }
    .toast { bottom: calc(24px + var(--sab)); max-width: calc(100vw - 32px); }
  }

  /* ---- 超窄屏（iPhone SE / 小屏安卓）---- */
  @media (max-width: 360px) {
    .grid-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .logo { font-size: 15px; }
    .logo em { display: none; }
    .fund-card { padding: 10px; }
    .modal { padding: 16px; }
  }

  /* ---- 横屏手机：压缩纵向留白，保证内容可见 ---- */
  @media (orientation: landscape) and (max-height: 500px) {
    main.wrap { padding-top: 8px; padding-bottom: 20px; }
    .panel { padding: 12px; margin-bottom: 10px; }
    .btn, input[type=text], input[type=password], .tab { min-height: 38px; }
    canvas { height: 160px; }
    .modal { max-height: 92dvh; }
    .modal-mask { align-items: flex-start; overflow-y: auto; padding-top: max(12px, var(--sat)); }
  }

  /* ---- 桌面端悬停反馈（触屏设备不触发，避免"粘住"） ---- */
  @media (hover: hover) and (pointer: fine) {
    .btn:not(:disabled):hover { filter: brightness(1.1); }
    .btn.ghost:hover { border-color: var(--primary); color: var(--primary); }
    .fund-card:hover, .search-item:hover { border-color: var(--primary); }
    .tab:hover:not(.active) { color: var(--text); border-color: var(--muted); }
    .admin-table tbody tr:hover td { background: rgba(56,189,248,.08); }
  }

  /* ---- 键盘可达性（PC 用户 Tab 导航） ---- */
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }

  /* ---- 系统偏好：减弱动画 ---- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <div class="logo">📈 基金盯盘 <em>FundWatch</em></div>
    <nav class="tabs">
      <button class="tab active" data-tab="watch">📌 自选</button>
      <button class="tab" data-tab="search">🔍 搜索</button>
      <button class="tab" data-tab="quote">⚡ 实时估值</button>
      <button class="tab" data-tab="detail">📊 详情</button>
      <button class="tab" data-tab="admin" id="tab-btn-admin" style="display:none">🛠 后台</button>
    </nav>
    <div class="user-box" id="user-box"></div>
  </div>
</header>

<main class="wrap">
  <!-- 自选 -->
  <section id="tab-watch">
    <div class="panel">
      <div class="row">
        <h2 style="margin:0;">我的自选基金</h2>
        <span class="auto-refresh" id="refresh-state">自动刷新中 · 30s</span>
      </div>
    </div>
    <div id="watch-list"></div>
    <div class="hint" style="margin-top:8px;" id="watch-hint">💡 添加自选：到「搜索」找到基金后点「加入自选」；或直接在「实时估值」页输入代码批量查询。</div>
  </section>

  <!-- 搜索 -->
  <section id="tab-search" style="display:none">
    <div class="panel">
      <h2>搜索基金</h2>
      <div class="row">
        <input type="text" id="search-input" placeholder="输入基金名称 / 代码 / 拼音缩写，如：中证A500、161725、A500">
        <button class="btn" id="search-btn">搜索</button>
      </div>
    </div>
    <div id="search-result"></div>
  </section>

  <!-- 实时估值 -->
  <section id="tab-quote" style="display:none">
    <div class="panel">
      <h2>盘中实时估值查询</h2>
      <div class="row">
        <input type="text" id="quote-input" placeholder="输入基金代码，逗号分隔，最多10只，如：161725,000001,110022">
        <button class="btn" id="quote-btn">查询估值</button>
        <button class="btn ghost" id="quote-watch-btn">全部加入自选</button>
      </div>
    </div>
    <div id="quote-list"></div>
  </section>

  <!-- 详情 -->
  <section id="tab-detail" style="display:none">
    <div class="panel">
      <h2>基金详情与净值走势</h2>
      <div class="row">
        <input type="text" id="detail-input" placeholder="输入6位基金代码，如：161725">
        <button class="btn" id="detail-btn">查看详情</button>
      </div>
    </div>
    <div id="detail-content"></div>
  </section>

  <!-- 后台管理（仅管理员可见） -->
  <section id="tab-admin" style="display:none">
    <div class="panel">
      <div class="row">
        <h2 style="margin:0;">🛠 后台管理 · 用户与自选</h2>
        <span class="auto-refresh" id="admin-updated"></span>
      </div>
    </div>
    <div class="admin-stats" id="admin-stats"></div>
    <div class="panel">
      <div class="row">
        <input type="text" id="admin-search" placeholder="搜索用户名…">
        <button class="btn" id="admin-search-btn">搜索</button>
        <button class="btn ghost" id="admin-refresh-btn">刷新</button>
      </div>
    </div>
    <div class="panel">
      <h2>注册用户（共 <span id="admin-total">0</span> 人）</h2>
      <div id="admin-users"></div>
    </div>
    <div class="panel" id="admin-funds-panel" style="display:none">
      <div class="row">
        <h2 style="margin:0;" id="admin-funds-title">用户自选基金</h2>
        <button class="btn ghost sm" id="admin-funds-close">收起</button>
      </div>
      <div id="admin-funds" style="margin-top:14px;"></div>
    </div>
  </section>
</main>

<div class="modal-mask" id="auth-modal">  <div class="modal">
    <h3 id="auth-title">登录 FundWatch</h3>
    <div class="err" id="auth-err"></div>
    <input type="text" id="auth-user" placeholder="用户名（3-20 位，字母/数字/下划线/中文）" autocomplete="username">
    <input type="password" id="auth-pass" placeholder="密码（6-72 位）" autocomplete="current-password">
    <div class="actions">
      <button class="btn" id="auth-submit">登录</button>
      <button class="btn ghost" id="auth-cancel">取消</button>
    </div>
    <div class="switch" id="auth-switch-line">还没有账号？<a id="auth-switch">立即注册</a></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
/* ============ 工具 ============ */
const $ = (s) => document.querySelector(s);
const fmt = (v) => (v === '' || v == null ? '--' : v);
const fmtNum = (v, d = 4) => (v === '' || v == null ? '--' : Number(v).toFixed(d));
const pctCls = (v) => { const n = Number(v); return isNaN(n) || n === 0 ? 'flat' : (n > 0 ? 'up' : 'down'); };
const sign = (v) => { const n = Number(v); return isNaN(n) ? '' : (n > 0 ? '+' : ''); };

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ============ 账号会话 ============ */
let session = { user: null };
let serverFavs = null;      // 登录后缓存的账号自选
let favSet = new Set();     // 供同步判断 isFav()
let authGen = 0;            // 认证动作代号：防止过期的异步回调覆盖较新的登录状态

async function apiJson(path, options = {}) {
  const r = await fetch(path, {
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    ...options,
  });
  let j = null;
  try { j = await r.json(); } catch { /* 非 JSON */ }
  if (!r.ok || !j || j.ok === false) throw new Error((j && j.error) || ('请求失败 HTTP ' + r.status));
  return j;
}

/** 已移除浏览器本地存储：自选数据一律来自账号（SQLite），见 getFavs/addFav/delFav。
 *  下面一行仅用于一次性清除旧版本遗留的本地键，不做任何写入。 */
try { localStorage.removeItem('fundWatch:favs'); } catch { /* 隐私模式等环境下忽略 */ }

async function loadServerFavs() {
  const j = await apiJson('/api/watchlist');
  serverFavs = j.items.map((it) => ({ code: it.code, name: it.name }));
  return serverFavs;
}

/** 自选数据全部来自账号（SQLite）；未登录时没有自选 */
async function getFavs() {
  if (!session.user) return [];
  if (!serverFavs) {
    try { await loadServerFavs(); } catch { serverFavs = []; }
  }
  return serverFavs;
}

function isFav(code) { return favSet.has(code); }

/** 未登录时引导登录 */
function requireLogin() {
  if (session.user) return true;
  toast('请先登录后再使用自选');
  openAuth('login');
  return false;
}

async function addFav(code, name) {
  if (!session.user) throw new Error('请先登录后再添加自选');
  await apiJson('/api/watchlist', { method: 'POST', body: JSON.stringify({ code, name }) });
  serverFavs = null;
  await getFavs();
  favSet.add(code);
}

async function delFav(code) {
  if (!session.user) throw new Error('请先登录');
  await apiJson('/api/watchlist/' + code, { method: 'DELETE' });
  serverFavs = null;
  await getFavs();
  favSet.delete(code);
}

function isAdminSession() { return !!session.user && session.user.role === 'admin'; }

function renderUserBox() {
  const box = $('#user-box');
  if (session.user) {
    const adminTag = isAdminSession() ? ' <span class="role-badge admin">管理员</span>' : '';
    box.innerHTML = `<span class="uname">👤 ${esc(session.user.username)}${adminTag}</span>
      <button class="btn ghost sm" id="logout-btn">退出</button>`;
    $('#logout-btn').onclick = doLogout;
  } else {
    box.innerHTML = `<button class="btn sm" id="login-btn">登录 / 注册</button>`;
    $('#login-btn').onclick = () => openAuth('login');
  }
  // 管理员入口：仅管理员可见
  const adminTab = $('#tab-btn-admin');
  if (adminTab) adminTab.style.display = isAdminSession() ? '' : 'none';
  if (!isAdminSession() && $('#tab-admin') && $('#tab-admin').style.display !== 'none') switchTab('watch');

  const hint = $('#watch-hint');
  if (hint) {
    hint.innerHTML = session.user
      ? `💡 自选保存在**账号**中（SQLite 持久化），换设备登录即可同步；点卡片「删除」即可移除。`
      : `💡 自选与账号绑定；<a id="hint-login" style="color:var(--primary);cursor:pointer;text-decoration:underline;">登录</a>后即可添加并跨设备同步（不再使用浏览器本地存储）。`;
    const hl = $('#hint-login');
    if (hl) hl.onclick = () => openAuth('login');
  }
}

async function loadSession() {
  try {
    const j = await apiJson('/api/auth/me');
    session.user = j.user || null;
  } catch { session.user = null; }
  renderUserBox();
}

/* ---- 登录/注册弹窗 ---- */
let authMode = 'login';

function openAuth(mode) {
  authMode = mode;
  $('#auth-err').textContent = '';
  $('#auth-user').value = '';
  $('#auth-pass').value = '';
  $('#auth-submit').disabled = false;   // 重置表单状态（上次登录的收尾可能仍在进行）
  $('#auth-modal').classList.add('show');
  applyAuthMode();
  setTimeout(() => $('#auth-user').focus(), 50);
}

function applyAuthMode() {
  const isLogin = authMode === 'login';
  $('#auth-title').textContent = isLogin ? '登录 FundWatch' : '注册新账号';
  $('#auth-submit').textContent = isLogin ? '登录' : '注册并登录';
  $('#auth-pass').setAttribute('autocomplete', isLogin ? 'current-password' : 'new-password');
  $('#auth-switch-line').innerHTML = isLogin
    ? '还没有账号？<a id="auth-switch">立即注册</a>'
    : '已有账号？<a id="auth-switch">去登录</a>';
  $('#auth-switch').onclick = () => { authMode = isLogin ? 'register' : 'login'; $('#auth-err').textContent = ''; applyAuthMode(); };
}

function closeAuth() { $('#auth-modal').classList.remove('show'); }

async function submitAuth() {
  const username = $('#auth-user').value.trim();
  const password = $('#auth-pass').value;
  const errBox = $('#auth-err');
  errBox.textContent = '';
  if (!username || !password) { errBox.textContent = '请输入用户名和密码'; return; }

  const gen = ++authGen;   // 本次登录动作的代号
  $('#auth-submit').disabled = true;
  try {
    const j = await apiJson('/api/auth/' + (authMode === 'login' ? 'login' : 'register'), {
      method: 'POST',
      body: JSON.stringify({ username, password }),
    });
    // 认证请求已返回：立即恢复按钮，避免后续刷新（估值等）期间按钮一直是禁用态
    $('#auth-submit').disabled = false;
    if (gen !== authGen) return;   // 已被更新的认证动作取代，丢弃过期结果
    session.user = j.user;
    closeAuth();
    renderUserBox();
    serverFavs = null;
    await refreshWatch();
    if (gen === authGen) toast(authMode === 'login' ? `欢迎回来，${session.user.username}` : `注册成功，${session.user.username}`);
  } catch (e) {
    if (gen === authGen) errBox.textContent = e.message;
  } finally {
    if (gen === authGen) $('#auth-submit').disabled = false;
  }
}

async function doLogout() {
  const gen = ++authGen;   // 登出动作代号：若期间发生新登录，则不复位界面状态
  try { await apiJson('/api/auth/logout', { method: 'POST' }); } catch { /* 忽略 */ }
  if (gen !== authGen) return;
  session.user = null;
  serverFavs = null;
  renderUserBox();
  await refreshWatch();
  if (gen === authGen) toast('已退出登录');
}

async function api(path) {
  const r = await fetch(path);
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || '接口错误');
  return j;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ============ 后台管理（管理员） ============ */
async function loadAdmin() {
  if (!isAdminSession()) {
    $('#admin-users').innerHTML = '<div class="empty">需要管理员权限，请用管理员账号登录</div>';
    $('#admin-stats').innerHTML = '';
    return;
  }
  $('#admin-updated').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN');
  $('#admin-users').innerHTML = '<div class="hint">加载中…</div>';
  try {
    const q = encodeURIComponent($('#admin-search').value.trim());
    const [s, u] = await Promise.all([apiJson('/api/admin/stats'), apiJson('/api/admin/users?q=' + q)]);
    renderAdminStats(s.stats);
    renderAdminUsers(u);
  } catch (e) {
    $('#admin-users').innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`;
  }
}

function renderAdminStats(st) {
  const items = [
    ['注册用户', st.users], ['管理员', st.admins],
    ['自选总条数', st.watchlistItems], ['有自选的用户', st.usersWithWatchlist],
    ['活跃会话', st.activeSessions],
  ];
  $('#admin-stats').innerHTML = items.map(([k, v]) =>
    `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
}

function renderAdminUsers(u) {
  $('#admin-total').textContent = u.total;
  if (!u.items.length) { $('#admin-users').innerHTML = '<div class="empty">没有匹配的用户</div>'; return; }
  $('#admin-users').innerHTML = `<div class="table-scroll"><table class="admin-table">
    <thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>注册时间</th><th>自选数</th><th>活跃会话</th><th>操作</th></tr></thead>
    <tbody>${u.items.map((it) => `<tr>
      <td>${it.id}</td>
      <td>${esc(it.username)}</td>
      <td><span class="role-badge ${it.role === 'admin' ? 'admin' : ''}">${it.role === 'admin' ? '管理员' : '普通用户'}</span></td>
      <td>${new Date(it.createdAt).toLocaleString('zh-CN')}</td>
      <td>${it.fundCount}</td>
      <td>${it.activeSessions}</td>
      <td>
        <button class="btn ghost sm" data-act="funds" data-id="${it.id}" data-name="${esc(it.username)}">查看自选</button>
        ${it.role === 'admin' ? '' : `<button class="btn ghost sm" data-act="reset" data-id="${it.id}" data-name="${esc(it.username)}">重置密码</button>
        <button class="btn danger sm" data-act="del" data-id="${it.id}" data-name="${esc(it.username)}">删除</button>`}
      </td>
    </tr>`).join('')}</tbody></table></div>`;

  $('#admin-users').querySelectorAll('button[data-act]').forEach((b) => {
    b.onclick = () => {
      const { act, id, name } = b.dataset;
      if (act === 'funds') showUserFunds(id, name);
      else if (act === 'reset') adminResetPassword(id, name);
      else if (act === 'del') adminDeleteUser(id, name);
    };
  });
}

async function showUserFunds(id, name) {
  const panel = $('#admin-funds-panel');
  panel.style.display = '';
  $('#admin-funds-title').textContent = `${name} 的自选基金`;
  $('#admin-funds').innerHTML = '<div class="hint">加载中…</div>';
  try {
    const j = await apiJson('/api/admin/users/' + id);
    if (!j.funds.length) { $('#admin-funds').innerHTML = '<div class="hint">该用户还没有添加自选基金</div>'; return; }
    $('#admin-funds').innerHTML = j.funds.map((f) =>
      `<span class="fund-chip"><b>${esc(f.code)}</b>${esc(f.name || '—')}
       <span class="hint"> · ${new Date(f.createdAt).toLocaleDateString('zh-CN')}</span></span>`).join('');
  } catch (e) {
    $('#admin-funds').innerHTML = `<div class="hint">加载失败：${esc(e.message)}</div>`;
  }
}

async function adminDeleteUser(id, name) {
  if (!confirm(`确认删除用户「${name}」？其自选基金与登录会话会一并删除，且不可恢复。`)) return;
  try {
    await apiJson('/api/admin/users/' + id, { method: 'DELETE' });
    toast(`已删除用户 ${name}`);
    $('#admin-funds-panel').style.display = 'none';
    loadAdmin();
  } catch (e) { toast('删除失败：' + e.message); }
}

async function adminResetPassword(id, name) {
  const pwd = prompt(`为「${name}」设置新密码（6-72 位）：`);
  if (!pwd) return;
  try {
    await apiJson('/api/admin/users/' + id, { method: 'POST', body: JSON.stringify({ action: 'resetPassword', password: pwd }) });
    toast(`已重置 ${name} 的密码（其登录会话已失效）`);
    loadAdmin();
  } catch (e) { toast('重置失败：' + e.message); }
}

/* ============ 标签页 ============ */
const TABS = ['watch', 'search', 'quote', 'detail', 'admin'];
function switchTab(name) {
  document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('active', x.dataset.tab === name));
  TABS.forEach((t) => { const el = $('#tab-' + t); if (el) el.style.display = t === name ? '' : 'none'; });
  if (name === 'admin') loadAdmin();
}
document.querySelectorAll('.tab').forEach((b) => {
  b.addEventListener('click', () => switchTab(b.dataset.tab));
});

/* ============ 自选列表 + 自动刷新估值 ============ */
function renderQuoteCard(f) {
  const pct = f.gszzl !== '' && f.gszzl != null ? Number(f.gszzl) : null;
  const cls = pct == null ? 'flat' : (pct > 0 ? 'up' : (pct < 0 ? 'down' : 'flat'));
  const time = f.gztime ? (f.available ? `估值时间 ${f.gztime}` : `最新净值 ${f.gztime}`) : '';
  const tag = f.available ? '<span class="badge">盘中估值</span>' : '<span class="badge" style="border-color:rgba(251,191,36,.5);color:var(--gold);">净值(非盘中)</span>';
  return `
    <div class="fund-card">
      <div class="fc-name">
        <div class="n">${esc(f.name || f.code)} ${tag}</div>
        <div class="c">${esc(f.code)} · ${time}</div>
      </div>
      <div class="fc-quote">
        <div class="q-num ${cls}">${fmtNum(f.gsz)}</div>
        <div class="q-pct ${cls}">${pct == null ? '--' : sign(pct) + pct.toFixed(2) + '%'}</div>
        <div class="q-time">昨净 ${fmtNum(f.dwjz)}</div>
      </div>
      <div class="row">
        <button class="btn ghost" onclick="openDetail('${esc(f.code)}')">详情</button>
        <button class="btn danger" onclick="removeWatch('${esc(f.code)}')">删除</button>
      </div>
    </div>`;
}

async function refreshWatch() {
  const box = $('#watch-list');
  // 未登录：自选数据在账号里，提示登录（不再有浏览器本地自选）
  if (!session.user) {
    favSet = new Set();
    box.innerHTML = `<div class="empty">🔒 自选基金保存在账号中，登录后即可使用<br><br>
      <button class="btn" onclick="openAuth('login')">登录 / 注册</button></div>`;
    return;
  }
  const list = await getFavs();
  favSet = new Set(list.map((f) => f.code));
  if (!list.length) {
    box.innerHTML = '<div class="empty">还没有自选基金，去「搜索」添加吧 🎯</div>';
    return;
  }
  box.innerHTML = '<div class="hint">加载中…</div>';
  try {
    const j = await api('/api/estimate?codes=' + list.map((f) => f.code).join(','));
    const map = {};
    j.items.forEach((it) => { map[it.code] = it; });
    box.innerHTML = list.map((f) => {
      const it = map[f.code] || { code: f.code, name: f.name, gsz: '', gszzl: '', gztime: '', dwjz: '' };
      if (!it.name) it.name = f.name;
      return renderQuoteCard(it);
    }).join('');
  } catch (e) {
    box.innerHTML = `<div class="empty">估值接口暂不可用：${esc(e.message)}</div>`;
  }
}

async function removeWatch(code) {
  try {
    await delFav(code);
    toast('已删除 ' + code);
  } catch (e) {
    toast('删除失败：' + e.message);
  }
  refreshWatch();
}
function openDetail(code) { $('#detail-input').value = code; loadDetail(code); document.querySelector('.tab[data-tab=detail]').click(); }

$('#search-input').addEventListener('input', () => {

});
$('#search-btn').addEventListener('click', doSearch);
$('#search-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

async function doSearch() {
  const kw = $('#search-input').value.trim();
  const box = $('#search-result');
  if (!kw) { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="hint">搜索中…</div>';
  try {
    const j = await api('/api/search?key=' + encodeURIComponent(kw));
    if (!j.items.length) { box.innerHTML = '<div class="empty">未找到相关基金，换个关键词试试</div>'; return; }
    box.innerHTML = j.items.map((it) => `
      <div class="search-item">
        <div class="si-info">
          <div class="n">${esc(it.name)} <span class="badge">${esc(it.category || '基金')}</span></div>
          <div class="c">代码 ${esc(it.code)}${it.pinyin ? ' · ' + esc(it.pinyin) : ''}</div>
        </div>
        <div class="row">
          ${isFav(it.code)
            ? '<button class="btn ghost" disabled>已自选</button>'
            : `<button class="btn" onclick="addWatch('${esc(it.code)}','${esc(it.name)}')">＋ 加入自选</button>`}

    box.innerHTML = `<div class="empty">搜索失败：${esc(e.message)}</div>`;
  }

async function addWatch(code, name) {
  if (!requireLogin()) return;
  try {
    await addFav(code, name);
    toast('已加入自选：' + name);
  } catch (e) {
    toast('加入失败：' + e.message);
  }
  doSearch();
  refreshWatch();
}

/* ============ 实时估值 ============ */
$('#quote-btn').addEventListener('click', doQuote);
$('#quote-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') doQuote(); });
$('#quote-watch-btn').addEventListener('click', async () => {

  refreshWatch();
});

async function doQuote() {
  const codes = $('#quote-input').value.split(/[,，\s]+/).map((s) => s.trim()).filter((s) => /^\d{6}$/.test(s)).slice(0, 10);
  const box = $('#quote-list');
  if (!codes.length) { box.innerHTML = '<div class="empty">请输入有效的6位基金代码</div>'; return; }
  box.innerHTML = '<div class="hint">查询中…</div>';
  try {
    const j = await api('/api/estimate?codes=' + codes.join(','));
    box.innerHTML = j.items.map(renderQuoteCard).join('');
  } catch (e) {
    box.innerHTML = `<div class="empty">查询失败：${esc(e.message)}</div>`;
  }
}

/* ============ 详情（服务端代理优先 + 浏览器直连兜底 + 净值走势 Canvas） ============ */
$('#detail-btn').addEventListener('click', () => loadDetail($('#detail-input').value.trim()));
$('#detail-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') loadDetail(e.target.value.trim()); });

function loadPingZhongData(code, timeout = 12000) {
  // 兜底通道：浏览器直连 pingzhongdata（部分手机网络/海外网络会失败，故仅作 fallback）
  return new Promise((resolve, reject) => {
    const key = '__pd' + code + '_' + Date.now();
    let done = false;
    const GLOBALS = ['fS_name', 'fS_code', 'Data_netWorthTrend', 'Data_ACWorthTrend',
      'syl_1z', 'syl_1y', 'syl_6y', 'syl_1n', 'syl_3y', 'fund_Rate', 'fund_sourceRate', 'fund_minsg'];
    function cleanup() {
      clearTimeout(timer);
      const s = document.getElementById(key);
      if (s) s.remove();
      GLOBALS.forEach((g) => { try { delete window[g]; } catch {} });
    }
    const timer = setTimeout(() => { cleanup(); reject(new Error('直连加载超时')); }, timeout);
    const s = document.createElement('script');
    s.id = key;
    s.src = `https://fund.eastmoney.com/pingzhongdata/${code}.js?rt=${Date.now()}`;
    s.onload = () => {
      if (done) return; done = true;
      const raw = Array.isArray(window.Data_netWorthTrend) ? window.Data_netWorthTrend : [];
      const num = (v) => (v === undefined || v === '' ? null : Number(v));
      const iso = (x) => new Date(x).toISOString().slice(0, 10);
      const snap = {
        name: window.fS_name || code,
        rate: window.fund_Rate, sourceRate: window.fund_sourceRate, minsg: window.fund_minsg,
        metrics: { m1: num(window.syl_1y), m6: num(window.syl_6y), y1: num(window.syl_1n), y3: num(window.syl_3y) },
        latestNav: raw.length ? raw[raw.length - 1].y : null,
        latestDate: raw.length ? iso(raw[raw.length - 1].x) : '',
        trend: raw.slice(-240).map((p) => ({ date: iso(p.x), nav: p.y })),
        _via: 'direct',
      };
      cleanup();
      resolve(snap);
    };
    s.onerror = () => { if (!done) { done = true; cleanup(); reject(new Error('直连脚本加载失败')); } };
    document.head.appendChild(s);
  });
}

async function fetchDetail(code) {
  // 主通道：服务端代理（手机无需直连东方财富域名，规避网络拦截）
  try {
    const j = await api(`/api/detail?code=${code}`);
    if (j && j.ok && j.found) return { ...j, _via: 'proxy' };
    if (j && j.ok && !j.found) throw new Error('未找到该基金的净值数据');
  } catch (e) {
    console.warn('detail proxy 不可用，回退浏览器直连：', e.message);
    return await loadPingZhongData(code);
  }
}

async function loadDetail(code) {
  const box = $('#detail-content');
  if (!/^\d{6}$/.test(code)) { box.innerHTML = '<div class="empty">请输入6位基金代码</div>'; return; }
  box.innerHTML = '<div class="hint">加载中…</div>';
  try {
    const pd = await fetchDetail(code);
    const name = pd.name || code;
    const trend = Array.isArray(pd.trend) ? pd.trend : [];
    const M = pd.metrics || {};
    const metrics = [
      ['近1月', M.m1], ['近6月', M.m6], ['近1年', M.y1], ['近3年', M.y3],
    ];
    const rate = pd.rate || '--';
    const srcRate = pd.sourceRate || '--';
    const minsg = pd.minsg || '--';
    const mday = pd.latestDate || '--';
    const last = pd.latestNav == null ? '--' : pd.latestNav;

    box.innerHTML = `
      <div class="panel">
        <div class="row">
          <div><div style="font-size:18px;font-weight:700;">${esc(name)}</div>
          <div class="hint">${code} · 最新净值 ${fmt(last)}（${mday}）· 申购费率 ${fmt(rate)}（原 ${fmt(srcRate)}）· 起购 ${fmt(minsg)}元</div></div>
          <button class="btn ghost" onclick="addWatch('${code}','${esc(name)}')">＋ 加入自选</button>
        </div>
      </div>
      <div class="panel">
        <h2>阶段收益（%）</h2>
        <div class="grid-metrics">
          ${metrics.map(([k, v]) => `<div class="metric"><div class="k">${k}</div><div class="v ${pctCls(v)}">${fmtNum(v, 2)}</div></div>`).join('')}
        </div>
      </div>
      <div class="panel">
        <h2>单位净值走势（近 ${trend.length} 期）</h2>
        <canvas id="nav-chart"></canvas>
      </div>
      <div class="panel">
        <h2>历史净值（近 15 期）</h2>
        <div id="nav-table"></div>
      </div>`;
    drawChart(trend.slice(-180));
    loadNavTable(code);
  } catch (e) {
    box.innerHTML = `<div class="empty">详情加载失败：${esc(e.message)}</div>`;
  }
}

let lastTrend = null;   // 缓存最近一次净值序列，供窗口/旋转变化时重绘

function drawChart(trend) {
  const cv = $('#nav-chart');
  if (!cv || !trend.length) return;
  lastTrend = trend;
  const ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth;
  const H = cv.clientHeight || 260;   // 跟随 CSS 高度（移动端 200px）
  cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
  const pad = { l: 10, r: 10, t: 16, b: 22 };
  const values = trend.map((p) => p.nav);
  let min = Math.min(...values), max = Math.max(...values);
  const span = max - min || 1; min -= span * 0.08; max += span * 0.08;
  const X = (i) => pad.l + (i / (trend.length - 1)) * (W - pad.l - pad.r);
  const Y = (v) => pad.t + (1 - (v - min) / (max - min)) * (H - pad.t - pad.b);
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = '#334155'; ctx.lineWidth = 1;
  for (let g = 0; g <= 3; g++) {
    const y = pad.t + (g / 3) * (H - pad.t - pad.b);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
  }
  const up = values[values.length - 1] >= values[0];
  ctx.strokeStyle = up ? '#ef4444' : '#22c55e'; ctx.lineWidth = 2;
  ctx.beginPath();
  trend.forEach((p, i) => { i === 0 ? ctx.moveTo(X(i), Y(p.nav)) : ctx.lineTo(X(i), Y(p.nav)); });
  ctx.stroke();
  const li = trend.length - 1;
  ctx.fillStyle = up ? '#ef4444' : '#22c55e';
  ctx.beginPath(); ctx.arc(X(li), Y(values[li]), 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#94a3b8'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(trend[0].date, pad.l, H - 6);
  ctx.fillText(trend[li].date, W - pad.r, H - 6);
}

async function loadNavTable(code) {
  const box = $('#nav-table');
  try {
    const j = await api(`/api/nav?code=${code}&page=1&size=15`);
    if (!j.items.length) { box.innerHTML = '<div class="hint">暂无净值数据</div>'; return; }
    box.innerHTML = `<div class="table-scroll"><table><thead><tr><th>日期</th><th>单位净值</th><th>累计净值</th><th>日涨跌</th><th>状态</th></tr></thead>
      <tbody>${j.items.map((d) => `<tr>
        <td>${d.date}</td><td>${fmtNum(d.dwjz)}</td><td>${fmtNum(d.ljjz)}</td>
        <td class="${pctCls(d.jzzzl)}">${sign(d.jzzzl)}${fmtNum(d.jzzzl, 2)}%</td>
        <td class="hint">${esc(d.sgzt || '')}</td></tr>`).join('')}</tbody></table></div>`;
  } catch (e) {
    box.innerHTML = `<div class="hint">净值表加载失败：${esc(e.message)}</div>`;
  }
}

/* ============ 账号交互绑定 ============ */
$('#auth-submit').addEventListener('click', submitAuth);
$('#auth-cancel').addEventListener('click', closeAuth);
$('#auth-user').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#auth-pass').focus(); });
$('#auth-pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitAuth(); });
$('#auth-modal').addEventListener('click', (e) => { if (e.target.id === 'auth-modal') closeAuth(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAuth(); });

/* ============ 后台交互绑定 ============ */
$('#admin-search-btn').addEventListener('click', loadAdmin);
$('#admin-refresh-btn').addEventListener('click', loadAdmin);
$('#admin-search').addEventListener('keydown', (e) => { if (e.key === 'Enter') loadAdmin(); });
$('#admin-funds-close').addEventListener('click', () => { $('#admin-funds-panel').style.display = 'none'; });

/* ============ 启动 ============ */
// 视口变化（窗口缩放 / 手机旋转 / 折叠屏展开）时重绘净值图，避免画布被拉伸
let resizeTimer = null;
const handleViewportChange = () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (lastTrend && $('#nav-chart')) drawChart(lastTrend);
  }, 150);
};
window.addEventListener('resize', handleViewportChange);
window.addEventListener('orientationchange', handleViewportChange);
if (window.visualViewport) window.visualViewport.addEventListener('resize', handleViewportChange);

(async function boot() {
  await loadSession();     // 读取登录态（/api/auth/me）
  await refreshWatch();    // 登录 → 账号自选；未登录 → 本地自选
  // 深链：#admin 直达后台
  if (location.hash === '#admin' && isAdminSession()) switchTab('admin');
  setInterval(() => { if (!document.hidden) refreshWatch(); }, 30000); // 页面隐藏时暂停刷新省电
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshWatch(); });
})();
</script>
