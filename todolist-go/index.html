<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f2">
  <title>今日待办 · TodoList</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; color: #22251f; background: #f5f5f2; font-synthesis: none; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 64px 20px; }
    main { width: min(100%, 620px); margin: 0 auto; }
    .eyebrow { margin: 0 0 12px; color: #8a8d83; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, "Songti SC", serif; font-size: clamp(36px, 8vw, 54px); font-weight: 500; letter-spacing: -.045em; }
    .intro { margin: 12px 0 32px; color: #85877f; font-size: 14px; }
    .composer { display: flex; gap: 10px; padding: 9px; border: 1px solid #e5e5df; border-radius: 14px; background: #fff; box-shadow: 0 8px 24px #20241408; }
    input { min-width: 0; flex: 1; padding: 10px 12px; border: 0; outline: 0; background: transparent; color: inherit; font: inherit; }
    input::placeholder { color: #b3b5ad; }
    button { border: 0; border-radius: 9px; font: inherit; cursor: pointer; transition: background .15s, color .15s, transform .15s; }
    button:active { transform: scale(.97); }
    .add { padding: 0 18px; background: #303c2b; color: white; font-size: 14px; }
    .add:hover { background: #46563d; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; margin: 25px 2px 12px; }
    .filters { display: flex; gap: 5px; }
    .filter { padding: 7px 11px; background: transparent; color: #878980; font-size: 13px; }
    .filter.active { background: #e9ebe4; color: #343b2f; }
    .count { color: #a0a197; font-size: 12px; }
    .list { overflow: hidden; border: 1px solid #e9e9e3; border-radius: 14px; background: #fff; }
    .task { display: flex; align-items: center; gap: 13px; min-height: 62px; padding: 12px 16px; border-bottom: 1px solid #f0f0eb; }
    .task:last-child { border-bottom: 0; }
    .check { display: grid; width: 20px; height: 20px; flex: 0 0 20px; place-items: center; border: 1px solid #d6d8cf; border-radius: 50%; background: #fff; color: transparent; }
    .task.done .check { border-color: #65765b; background: #65765b; color: #fff; }
    .task-title { flex: 1; overflow-wrap: anywhere; font-size: 14px; line-height: 1.55; }
    .task.done .task-title { color: #aaaca4; text-decoration: line-through; }
    .delete { padding: 7px 9px; background: transparent; color: #b0b1aa; font-size: 12px; opacity: 0; }
    .task:hover .delete, .delete:focus-visible { opacity: 1; }
    .delete:hover { background: #f7eeee; color: #a45050; }
    .empty { padding: 48px 18px; color: #9b9d95; text-align: center; font-size: 14px; }
    .error { min-height: 20px; margin: 10px 3px; color: #ae4b4b; font-size: 12px; }
    @media (max-width: 520px) { body { padding: 44px 18px; } .delete { opacity: 1; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A little more intentional</p>
    <h1>今日待办</h1>
    <p class="intro">把想做的事写下来，一件一件完成。</p>
    <form class="composer" id="form">
      <input id="title" maxlength="200" placeholder="接下来想完成什么？" autocomplete="off" aria-label="新任务内容">
      <button class="add" type="submit">添加任务</button>
    </form>
    <div class="error" id="error" role="status"></div>
    <section aria-label="任务列表">
      <div class="toolbar">
        <div class="filters" role="group" aria-label="筛选任务">
          <button class="filter active" data-filter="all">全部</button>
          <button class="filter" data-filter="active">进行中</button>
          <button class="filter" data-filter="done">已完成</button>
        </div>
        <span class="count" id="count"></span>
      </div>
      <div class="list" id="list" aria-live="polite"></div>
    </section>
  </main>
  <script>
    const list = document.querySelector('#list');
    const count = document.querySelector('#count');
    const errorBox = document.querySelector('#error');
    let tasks = [];
    let filter = 'all';

    async function request(path, options) {
      const response = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...options });
      if (!response.ok) {
        const result = await response.json().catch(() => ({}));
        throw new Error(result.error || '请求失败，请稍后重试');
      }
      return response.status === 204 ? null : response.json();
    }

    function render() {
      const remaining = tasks.filter(task => !task.done).length;
      count.textContent = `${remaining} 项待完成`;
      const visible = tasks.filter(task => filter === 'all' || (filter === 'active' && !task.done) || (filter === 'done' && task.done));
      list.replaceChildren();
      if (!visible.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = tasks.length ? '这个列表暂时为空。' : '还没有任务，添加一件想做的事吧。';
        list.append(empty);
        return;
      }
      for (const task of visible) {
        const row = document.createElement('div');
        row.className = `task${task.done ? ' done' : ''}`;
        const check = document.createElement('button');
        check.className = 'check';
        check.type = 'button';
        check.textContent = '✓';
        check.setAttribute('aria-label', task.done ? '标记为未完成' : '标记为已完成');
        check.addEventListener('click', () => mutate(async () => {
          await request(`/api/tasks/${task.id}`, { method: 'PATCH', body: JSON.stringify({ done: !task.done }) });
          await load();
        }));
        const title = document.createElement('span');
        title.className = 'task-title';
        title.textContent = task.title;
        const remove = document.createElement('button');
        remove.className = 'delete';
        remove.type = 'button';
        remove.textContent = '删除';
        remove.setAttribute('aria-label', `删除任务：${task.title}`);
        remove.addEventListener('click', () => mutate(async () => {
          await request(`/api/tasks/${task.id}`, { method: 'DELETE' });
          await load();
        }));
        row.append(check, title, remove);
        list.append(row);
      }
    }

    async function load() {
      tasks = await request('/api/tasks');
      render();
    }

    async function mutate(action) {
      errorBox.textContent = '';
      try { await action(); } catch (error) { errorBox.textContent = error.message; }
    }

    document.querySelector('#form').addEventListener('submit', event => {
      event.preventDefault();
      const input = document.querySelector('#title');
      const title = input.value.trim();
      if (!title) { input.focus(); return; }
      mutate(async () => {
        await request('/api/tasks', { method: 'POST', body: JSON.stringify({ title }) });
        input.value = '';
        await load();
        input.focus();
      });
    });

    document.querySelectorAll('.filter').forEach(button => button.addEventListener('click', () => {
      filter = button.dataset.filter;
      document.querySelectorAll('.filter').forEach(item => item.classList.toggle('active', item === button));
      render();
    }));

    load().catch(error => { errorBox.textContent = error.message; });
  </script>
</body>
</html>
